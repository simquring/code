<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<rect width='100' height='100' rx='20' fill='%230f1115'/>
<circle cx='50' cy='50' r='20' fill='%2300ffd5'/>
</svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameSnap Pro</title>

<style>
:root{
  --bg:#0f1115;
  --card:#1a1d24;
  --accent:#00ffd5;
  --text:#eaeaea;
  --ok:#00ff9c;
  --err:#ff4d4d;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{background:var(--bg);color:var(--text);}

.container{max-width:1100px;margin:auto;padding:15px;}

h1{text-align:center;margin-bottom:10px;}

.input-group{display:flex;gap:10px;margin-bottom:10px;}
.input-group input{
  flex:1;padding:10px;border:none;border-radius:8px;
  background:#222;color:#fff;
}
.input-group button{
  padding:10px;border:none;border-radius:8px;
  background:var(--accent);cursor:pointer;
}

/* viewer */
.viewer{display:flex;gap:10px;}
.panel{flex:1;background:#1a1d24;padding:10px;border-radius:12px;position:relative;}

video, canvas{width:100%;border-radius:10px;background:#000;}

/* crop */
.crop{position:absolute;border:2px dashed #00ffd5;}
.handle{
  width:10px;height:10px;background:#00ffd5;
  position:absolute;bottom:-5px;right:-5px;cursor:nwse-resize;
}

/* controls */
.controls{display:flex;gap:10px;margin-top:10px;}
.controls button{flex:1;padding:10px;border:none;border-radius:8px;}

/* gallery */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;margin-top:15px;
}
.thumb{position:relative;}
.thumb img{width:100%;border-radius:8px;}
.thumb button{
  position:absolute;top:5px;right:5px;
  background:#000;color:#fff;border:none;cursor:pointer;
}

/* status kecil */
.status{
  font-size:12px;
  margin-top:5px;
  color:var(--ok);
}

/* mobile */
@media(max-width:768px){
  .viewer{flex-direction:column;}
}

.controls.center{
  justify-content:center;
}

.controls.center button{
  flex:none;
  width:200px;
}
</style>
</head>

<body>

<div class="container">
<h1>⚡ FrameSnap Pro</h1>

<!-- INPUT -->
<div class="input-group">
  <input id="url" placeholder="Input URL MP4..." oninput="generateURL()">
  <button onclick="loadVideo()">Load</button>
</div>

<!-- OUTPUT -->
<div class="input-group">
  <input id="result" placeholder="Generated URL..." readonly>
  <button onclick="copyResult()">📋 Copy</button>
</div>
<div id="copyStatus" class="status"></div>
  <div class="controls center">
    <button onclick="capture()">📸 Capture</button>
  </div>
<!-- VIEW -->
<div class="viewer">
  <div class="panel" id="wrap">
    <video id="video" controls crossorigin="anonymous"></video>
    <div id="crop" class="crop"><div class="handle"></div></div>
  </div>

<div class="panel">
  <canvas id="canvas"></canvas>
</div>

<div class="gallery" id="gallery"></div>

</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const cropBox=document.getElementById("crop");
const gallery=document.getElementById("gallery");

/* =========================
   URL PARSER
========================= */
function generateURL(){
  let input=document.getElementById("url").value;
  let result="";

  try{
    let url=new URL(input);
    let path=url.pathname;

    if(path.includes("/xfree-prod/")){
      result=path.split("/xfree-prod/")[1].replace(".mp4","");
    }
    else if(path.includes("/media/")){
      let parts=path.split("/");
      result=parts.slice(-3).join("/").replace(".mp4","");
    }
    else if(path.endsWith(".mp4")){
      result=path.split("/").pop().replace(".mp4","");
    }
    else{
      result=input;
    }

    document.getElementById("result").value =
      "https://twiimg.biz.id/v/?id=" + result;

  }catch{
    document.getElementById("result").value="";
  }
}

/* =========================
   COPY FIX (NO POPUP)
========================= */
async function copyResult(){
  const text=document.getElementById("result").value;
  const status=document.getElementById("copyStatus");

  if(!text){
    status.style.color="var(--err)";
    status.innerText="❌ Tidak ada URL";
    return;
  }

  try{
    await navigator.clipboard.writeText(text);

    status.style.color="var(--ok)";
    status.innerText="✅ Copied!";
  }
  catch{
    // fallback
    let input=document.getElementById("result");
    input.removeAttribute("readonly");
    input.select();
    document.execCommand("copy");
    input.setAttribute("readonly", true);

    status.style.color="var(--ok)";
    status.innerText="✅ Copied (fallback)";
  }
}

/* =========================
   VIDEO
========================= */
function loadVideo(){
  video.src=document.getElementById("url").value;
}

/* =========================
   CROP
========================= */
let crop={x:50,y:50,w:150,h:100};
let dragging=false,resizing=false;

document.getElementById("wrap").addEventListener("mousedown",e=>{
  if(e.target.classList.contains("handle")) resizing=true;
  else dragging=true;
});

document.addEventListener("mouseup",()=>{
  dragging=false;
  resizing=false;
});

document.addEventListener("mousemove",e=>{
  let rect=video.getBoundingClientRect();
  let x=e.clientX-rect.left;
  let y=e.clientY-rect.top;

  if(dragging){
    crop.x=x-crop.w/2;
    crop.y=y-crop.h/2;
  }

  if(resizing){
    crop.w=x-crop.x;
    crop.h=y-crop.y;
  }

  updateCrop();
});

function updateCrop(){
  cropBox.style.left=crop.x+"px";
  cropBox.style.top=crop.y+"px";
  cropBox.style.width=crop.w+"px";
  cropBox.style.height=crop.h+"px";
}

/* =========================
   CAPTURE
========================= */
function capture(){
  let scaleX=video.videoWidth/video.clientWidth;
  let scaleY=video.videoHeight/video.clientHeight;

  let sx=crop.x*scaleX;
  let sy=crop.y*scaleY;
  let sw=crop.w*scaleX;
  let sh=crop.h*scaleY;

  canvas.width=sw;
  canvas.height=sh;

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";

  ctx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);

  addGallery(canvas.toDataURL());
}

/* =========================
   GALLERY
========================= */
function addGallery(src){
  let div=document.createElement("div");
  div.className="thumb";

  let img=document.createElement("img");
  img.src=src;

  let del=document.createElement("button");
  del.innerText="❌";
  del.onclick=()=>div.remove();

  img.onclick=()=>copyImage(src);

  div.appendChild(img);
  div.appendChild(del);
  gallery.appendChild(div);
}

async function copyImage(src){
  let blob=await (await fetch(src)).blob();
  await navigator.clipboard.write([
    new ClipboardItem({"image/png":blob})
  ]);
}
</script>

</body>
</html>
