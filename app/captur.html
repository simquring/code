<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameSnap Pro</title>

<style>
:root{
  --bg:#0f1115;
  --card:#1a1d24;
  --accent:#00ffd5;
  --text:#eaeaea;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

h1{text-align:center;margin-bottom:10px;}
.input-group{display:flex;gap:10px;margin-bottom:10px;}
.input-group input{flex:1;padding:10px;border-radius:8px;border:none;background:#222;color:#fff;}
.input-group button{padding:10px;border:none;border-radius:8px;background:var(--accent);cursor:pointer;}

.viewer{display:flex;gap:10px;}
.panel{flex:1;position:relative;background:#1a1d24;padding:10px;border-radius:12px;}

video{width:100%;border-radius:10px;}
canvas{width:100%;border-radius:10px;background:#000;}

/* crop */
.crop{
  position:absolute;
  border:2px dashed #00ffd5;
}

.handle{
  width:10px;height:10px;background:#00ffd5;
  position:absolute;
}

.br{bottom:-5px;right:-5px;cursor:nwse-resize;}
.tl{top:-5px;left:-5px;cursor:nwse-resize;}

.controls{display:flex;gap:10px;margin-top:10px;}
.controls button, select{
  flex:1;padding:10px;border:none;border-radius:8px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  margin-top:15px;
}

.thumb{
  position:relative;
}

.thumb img{
  width:100%;
  border-radius:8px;
}

.thumb button{
  position:absolute;
  top:5px;
  right:5px;
  background:#000;
  color:#fff;
  border:none;
  font-size:12px;
  cursor:pointer;
}

/* mobile */
@media(max-width:768px){
  .viewer{flex-direction:column;}
}
</style>
</head>

<body>

<div class="container">
<h1>⚡ FrameSnap Pro</h1>

<div class="input-group">
  <input id="url" placeholder="URL video">
  <button onclick="loadVideo()">Load</button>
</div>

<select id="ratio">
  <option value="free">Free</option>
  <option value="1">1:1</option>
  <option value="1.777">16:9</option>
  <option value="1.333">4:3</option>
</select>

<div class="viewer">
  <div class="panel" id="wrap">
    <video id="video" controls crossorigin="anonymous"></video>
    <div id="crop" class="crop">
      <div class="handle br"></div>
    </div>
  </div>

  <div class="panel">
    <canvas id="canvas"></canvas>
  </div>
</div>

<div class="controls">
  <button onclick="capture()">📸 Capture</button>
</div>

<div class="gallery" id="gallery"></div>

</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const cropBox=document.getElementById("crop");
const gallery=document.getElementById("gallery");

let crop={x:50,y:50,w:150,h:100};
let dragging=false,resizing=false;

document.getElementById("wrap").addEventListener("mousedown",e=>{
  if(e.target.classList.contains("handle")){
    resizing=true;
  }else{
    dragging=true;
  }
});

document.addEventListener("mouseup",()=>{
  dragging=false;
  resizing=false;
});

document.addEventListener("mousemove",e=>{
  let rect=video.getBoundingClientRect();
  let x=e.clientX-rect.left;
  let y=e.clientY-rect.top;

  if(dragging){
    crop.x=x-crop.w/2;
    crop.y=y-crop.h/2;
  }

  if(resizing){
    crop.w=x-crop.x;
    let ratio=document.getElementById("ratio").value;

    if(ratio!=="free"){
      crop.h=crop.w/ratio;
    }else{
      crop.h=y-crop.y;
    }
  }

  updateCrop();
});

function updateCrop(){
  cropBox.style.left=crop.x+"px";
  cropBox.style.top=crop.y+"px";
  cropBox.style.width=crop.w+"px";
  cropBox.style.height=crop.h+"px";
}

function loadVideo(){
  video.src=document.getElementById("url").value;
}

function capture(){
  let scaleX=video.videoWidth/video.clientWidth;
  let scaleY=video.videoHeight/video.clientHeight;

  let sx=crop.x*scaleX;
  let sy=crop.y*scaleY;
  let sw=crop.w*scaleX;
  let sh=crop.h*scaleY;

  canvas.width=sw;
  canvas.height=sh;
  ctx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);

  addToGallery(canvas.toDataURL());
}

function addToGallery(src){
  let div=document.createElement("div");
  div.className="thumb";

  let img=document.createElement("img");
  img.src=src;

  let btn=document.createElement("button");
  btn.innerText="❌";
  btn.onclick=()=>div.remove();

  img.onclick=()=>copy(src);

  div.appendChild(img);
  div.appendChild(btn);
  gallery.appendChild(div);
}

async function copy(src){
  let blob=await (await fetch(src)).blob();
  await navigator.clipboard.write([
    new ClipboardItem({"image/png":blob})
  ]);
  alert("Copied!");
}
</script>

</body>
</html>
