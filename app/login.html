<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XLock • Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-4">
    <div class="glass border border-white/10 rounded-3xl p-10 shadow-2xl">
      <div class="flex justify-center mb-8">
        <div class="bg-gradient-to-br from-cyan-400 to-purple-600 text-white px-6 py-3 rounded-2xl font-bold text-3xl tracking-tighter flex items-center gap-2">
          <i class="fa-solid fa-shield-halved"></i> XLOCK
        </div>
      </div>
      <h1 class="text-4xl font-bold text-center mb-2">Admin Access</h1>
      <p class="text-zinc-400 text-center mb-8">Secure licensing dashboard</p>

      <form id="loginForm" class="space-y-6">
        <div>
          <label class="block text-sm mb-2">Email</label>
          <input type="email" id="email" required class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 transition">
        </div>
        <div>
          <label class="block text-sm mb-2">Password</label>
          <input type="password" id="password" required class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 focus:outline-none focus:border-cyan-400 transition">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-cyan-400 to-purple-600 hover:brightness-110 py-4 rounded-2xl font-semibold text-lg transition">SIGN IN</button>
      </form>
    </div>
    <p class="text-center text-zinc-500 text-sm mt-6">Demo: admin@example.com / admin123</p>
  </div>

  <script>
    const API = "https://xsafe.stakemail91.workers.dev";
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const json = await res.json();

      if (json.success) {
        localStorage.setItem('xlock_token', json.data.token);
        localStorage.setItem('xlock_user', JSON.stringify(json.data.user));
        window.location.href = 'index.html';
      } else {
        alert(json.message);
      }
    });
  </script>
</body>
</html>
