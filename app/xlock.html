<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>License Panel</title>
<style>
body {
  font-family: sans-serif;
  background: #0f172a;
  color: white;
  padding:20px;
}
.card {
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}
input, button {
  padding:10px;
  margin:5px;
  width:100%;
}
button {
  background:#38bdf8;
  border:none;
}
</style>
</head>
<body>

<div class="card">
  <h2>Tambah Domain</h2>
  <input id="domain" placeholder="example.com">
  <button onclick="add()">Generate License</button>

  <pre id="result"></pre>
</div>

<script>
async function add() {
  const domain = document.getElementById("domain").value;

  const res = await fetch("https://xlock.stakemail91.workers.dev/add", {
    method:"POST",
    body: JSON.stringify({ domain })
  });

  const data = await res.json();

  document.getElementById("result").innerText =
    "KEY: " + data.license_key +
    "\nExpire: " + new Date(data.expire_at * 1000);
}
</script>

</body>
</html>
