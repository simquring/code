<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLOCK SaaS</title>

<style>
body{margin:0;font-family:sans-serif;background:#020617;color:white;display:flex;justify-content:center;}
.container{max-width:1000px;width:100%;padding:20px;}
.card{background:#0f172a;padding:20px;border-radius:12px;margin-bottom:20px;}
input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;}
button{padding:10px;border:none;border-radius:8px;margin:3px;cursor:pointer;}
.badge{padding:3px 8px;border-radius:999px;font-size:12px;}
.active{background:#22c55e;} .expired{background:#ef4444;} .disabled{background:#6b7280;}
</style>
</head>

<body>
<div class="container">

<div class="card" id="loginBox">
<h3>Login</h3>
<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">

<div class="card">
<h3>Generate License</h3>
<input id="max" placeholder="max domain">
<button onclick="create()">Generate</button>
<div id="out"></div>
</div>

<div class="card">
<h3>License Dashboard</h3>
<div id="stats"></div>
<div id="list"></div>
</div>

</div>

</div>

<script>
const API="https://xlock.stakemail91.workers.dev";
let TOKEN = localStorage.getItem("token");
let SESSION = null;

if(TOKEN){
  init();
}

async function init(){
  loginBox.style.display="none";
  panel.style.display="block";
  start();
}

// LOGIN
async function login(){
  const res = await fetch(API+"/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email:email.value, password:pass.value })
  });

  const d = await res.json();

  if(d.status==="OK"){
    TOKEN = d.token;
    localStorage.setItem("token", TOKEN);
    location.reload();
  } else alert(d.message);
}

// CREATE
async function create(){
  const res = await fetch(API+"/add",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": TOKEN
    },
    body: JSON.stringify({ maxDomain: max.value })
  });

  const d = await res.json();
  out.innerHTML = d.license;
}

// LOAD
async function load(){
  const res = await fetch(API+"/list",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": TOKEN
    }
  });

  const data = await res.json();

  let a=0,e=0,d=0;

  list.innerHTML = data.map(x=>{
    if(x.status==="ACTIVE") a++;
    if(x.status==="EXPIRED") e++;
    if(x.status==="DISABLED") d++;

    let cls="active";
    if(x.status==="EXPIRED") cls="expired";
    if(x.status==="DISABLED") cls="disabled";

    return `
    <div class="card">
      ${x.email}<br>
      <span class="badge ${cls}">${x.status}</span><br>
      Exp: ${new Date(x.expire).toLocaleDateString()}<br>
      Sisa: ${x.remaining}/${x.maxDomain}<br>

      <button onclick="toggle('${x.id}')">Toggle</button>
      <button onclick="del('${x.id}')">Delete</button>
    </div>
    `;
  }).join("");

  stats.innerHTML = `Active:${a} | Expired:${e} | Disabled:${d}`;
}

// REALTIME
function start(){
  load();
  setInterval(load,5000);
}

// ACTION
async function toggle(id){
  await fetch(API+"/toggle",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({ id })
  });
}

async function del(id){
  await fetch(API+"/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({ id })
  });
}
</script>

</body>
</html>
