<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLOCK Generate Licensi</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:white;
}

/* CENTER LOGIN */
.center{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:16px;
  padding:25px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:#020617;
  color:white;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#3b82f6;
  color:white;
}

/* DASHBOARD */
.container{max-width:1200px;margin:auto;padding:20px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.license{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:12px;
  transition:0.2s;
}
.license:hover{transform:scale(1.02)}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}
.active{background:#22c55e}
.expired{background:#ef4444}
.disabled{background:#6b7280}

.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.toggle{
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <div class="card" style="width:300px;text-align:center">
    <h2>XLOCK LOGIN</h2>
    <input id="email" placeholder="email">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- PANEL -->
<div id="panel" style="display:none" class="container">

<div class="topbar">
  <h2>🚀 XLOCK DASHBOARD</h2>
  <button onclick="logout()">Logout</button>
</div>

<!-- ADMIN -->
<div id="adminBox" class="card" style="display:none">
<h3>👤 Add User</h3>
<input id="newEmail" placeholder="email">
<input id="newPass" placeholder="password">
<select id="newRole">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button onclick="addUser()">Tambah</button>
<div id="msg"></div>
</div>

<!-- GENERATE -->
<div class="card">
<h3>🔑 Generate License</h3>
<input id="max" placeholder="max domain (contoh: 3)">
<button onclick="create()">Generate</button>
<div id="out"></div>
</div>

<!-- STATS -->
<div class="card">
<h3>📊 Statistik</h3>
<div id="stats"></div>
</div>

<!-- LIST -->
<div id="list" class="grid"></div>

</div>

<script>
const API="https://xlock.stakemail91.workers.dev";
let TOKEN=localStorage.getItem("token");

// AUTO LOGIN
if(TOKEN){
  startApp();
}

function startApp(){
  loginPage.style.display="none";
  panel.style.display="block";
  load();
  setInterval(load,4000);
}

// LOGIN
async function login(){
  const res=await fetch(API+"/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email:email.value,password:pass.value })
  });

  const d=await res.json();

  if(d.status==="OK"){
    TOKEN=d.token;
    localStorage.setItem("token",TOKEN);

    if(d.role==="admin"){
      adminBox.style.display="block";
    }

    startApp();
  } else alert(d.message);
}

// LOGOUT
function logout(){
  localStorage.clear();
  location.reload();
}

// ADD USER
async function addUser(){
  const res=await fetch(API+"/add-user",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({
      email:newEmail.value,
      password:newPass.value,
      role:newRole.value
    })
  });

  const d=await res.json();
  msg.innerHTML=d.message||d.error;
}

// CREATE LICENSE
async function create(){
  const res=await fetch(API+"/add",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({ maxDomain:max.value })
  });

  const d=await res.json();
  out.innerHTML="License: "+d.license;
}

// LOAD DATA
async function load(){
  const res=await fetch(API+"/list",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN }
  });

  const data=await res.json();

  let a=0,e=0,d=0;

  list.innerHTML=data.map(x=>{
    if(x.status==="ACTIVE") a++;
    if(x.status==="EXPIRED") e++;
    if(x.status==="DISABLED") d++;

    let cls="active";
    if(x.status==="EXPIRED") cls="expired";
    if(x.status==="DISABLED") cls="disabled";

    return `
    <div class="license">
      <b>${x.email}</b><br>
      <span class="badge ${cls}">${x.status}</span><br><br>

      Aktif sampai:<br>
      ${new Date(x.expire).toLocaleDateString()}<br><br>

      Domain: ${x.domains.length}/${x.maxDomain}<br><br>

      <button onclick="toggle('${x.id}')">Toggle</button>
      <button onclick="del('${x.id}')">Delete</button>
    </div>
    `;
  }).join("");

  stats.innerHTML=`
  Active: ${a} | Expired: ${e} | Disabled: ${d}
  `;
}

// ACTION
async function toggle(id){
  await fetch(API+"/toggle",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({id})
  });
}
async function del(id){
  await fetch(API+"/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({id})
  });
}
</script>

</body>
</html>
