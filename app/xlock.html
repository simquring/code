<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLOCK DASBOARD</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI',sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border-radius:16px;
  padding:20px;
  margin:10px 0;
  transition:0.3s;
}

.card:hover{
  transform: translateY(-5px);
}

input,button{
  padding:10px;
  border:none;
  border-radius:8px;
  margin:5px;
}

button{
  background: linear-gradient(45deg,#00c6ff,#0072ff);
  color:white;
  cursor:pointer;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  padding:5px 10px;
  border-radius:8px;
}

.active{background:green;}
.disabled{background:red;}
</style>
</head>

<body>

<div id="login" class="container">
  <div class="card">
    <h2>XLOCK Login</h2>
    <input id="email" placeholder="Email"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="app" style="display:none" class="container">

  <div class="topbar">
    <h2>XLOCK Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h3>Generate License</h3>
    <input id="licEmail" placeholder="User Email">
    <input id="maxDomain" placeholder="Max Domain">
    <button onclick="add()">Generate</button>
  </div>

  <div id="list"></div>

</div>

<script>
const API = "https://xlock.stakemail91.workers.dev/";

async function login(){
  const res = await fetch(API+"/login",{
    method:"POST",
    body:JSON.stringify({
      email:email.value,
      password:pass.value
    })
  });
  const data = await res.json();
  localStorage.token = data.token;
  init();
}

function logout(){
  localStorage.clear();
  location.reload();
}

async function add(){
  await fetch(API+"/add",{
    method:"POST",
    headers:{Authorization:"Bearer "+localStorage.token},
    body:JSON.stringify({
      email:licEmail.value,
      maxDomain:Number(maxDomain.value)
    })
  });
}

async function load(){
  const res = await fetch(API+"/list",{
    method:"POST",
    headers:{Authorization:"Bearer "+localStorage.token}
  });
  const data = await res.json();

  list.innerHTML = data.map(l=>`
    <div class="card">
      <b>${l.id}</b><br>
      ${l.email}<br>
      Domain: ${l.domains.length}/${l.maxDomain}<br>
      Expire: ${new Date(l.expire).toLocaleDateString()}<br>
      <span class="badge ${l.status==='ACTIVE'?'active':'disabled'}">
        ${l.status}
      </span><br>
      <button onclick="toggle('${l.id}')">Toggle</button>
    </div>
  `).join("");
}

async function toggle(id){
  await fetch(API+"/toggle",{
    method:"POST",
    headers:{Authorization:"Bearer "+localStorage.token},
    body:JSON.stringify({id})
  });
}

function init(){
  if(!localStorage.token) return;
  login.style.display="none";
  app.style.display="block";
  load();
  setInterval(load,3000);
}

init();
</script>

</body>
</html>
