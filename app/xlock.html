<!DOCTYPE html>
<html>
<head>
<title>XLOCK Dashboard</title>
<style>
body {
  font-family: sans-serif;
  background: linear-gradient(135deg,#1e3c72,#2a5298);
  color: white;
}
.card {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}
button {
  padding: 8px;
  margin: 5px;
}
</style>
</head>
<body>

<div id="login">
  <h2>Login</h2>
  <input id="email" placeholder="email"><br>
  <input id="pass" placeholder="password"><br>
  <button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">
  <h2>XLOCK Dashboard</h2>
  <button onclick="logout()">Logout</button>

  <div id="admin"></div>
  <div id="list"></div>
</div>

<script>
const API = "https://xlock.stakemail91.workers.dev";

async function login(){
  const res = await fetch(API+"/login",{
    method:"POST",
    body:JSON.stringify({
      email:email.value,
      password:pass.value
    })
  });
  const data = await res.json();
  localStorage.token = data.token;
  init();
}

function logout(){
  localStorage.clear();
  location.reload();
}

async function init(){
  if(!localStorage.token) return;
  login.style.display="none";
  app.style.display="block";
  load();
  setInterval(load,4000);
}

async function load(){
  const res = await fetch(API+"/list",{
    method:"POST",
    headers:{Authorization:"Bearer "+localStorage.token}
  });
  const data = await res.json();

  list.innerHTML = data.map(l=>`
    <div class="card">
      <b>${l.id}</b><br>
      Owner: ${l.email}<br>
      Domain: ${l.domains.length}/${l.maxDomain}<br>
      Status: ${l.status}<br>
      <button onclick="toggle('${l.id}')">Toggle</button>
    </div>
  `).join("");
}

async function toggle(id){
  await fetch(API+"/toggle",{
    method:"POST",
    headers:{Authorization:"Bearer "+localStorage.token},
    body:JSON.stringify({id})
  });
}

init();
</script>

</body>
</html>
