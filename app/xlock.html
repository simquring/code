<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background:#020617;
  color:white;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
}
.container { max-width:900px; width:100%; padding:20px; }
.card { background:#0f172a; padding:20px; border-radius:12px; margin-bottom:20px; text-align:center;}
button { padding:10px; border-radius:8px; border:none; cursor:pointer;}
input { width:100%; padding:10px; margin:5px 0; border-radius:8px; border:none;}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loginBox">
<h2>Login</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">

<div class="card">
<h2>Generate License</h2>
<input id="user">
<input id="max">
<button onclick="create()">Generate</button>
<div id="out"></div>
</div>

<div class="card">
<h2>License List</h2>
<button onclick="load()">Refresh</button>
<div id="list"></div>
</div>

</div>

</div>

<script>
const API = "https://xlock.stakemail91.workers.dev";
let ROLE = "";

function format(date){
  return new Date(date).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
}

async function login(){
  const res = await fetch(API+"/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username:u.value, password:p.value })
  });

  const d = await res.json();

  if(d.status==="OK"){
    ROLE = d.role;
    loginBox.style.display="none";
    panel.style.display="block";
    load();
  } else alert(d.message);
}

async function create(){
  const res = await fetch(API+"/add",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user:user.value, maxDomain:max.value })
  });
  const d = await res.json();
  out.innerHTML = d.license+"<br>"+format(d.expire);
}

async function load(){
  const res = await fetch(API+"/list");
  const data = await res.json();

  list.innerHTML = data.map(d=>`
    <div class="card">
      ${d.user}<br>
      Status: ${d.status}<br>
      Exp: ${format(d.expire)}<br>
      Domain: ${d.domains.join(",")||"-"}<br>
      Sisa Slot: ${d.remaining}<br><br>

      <button onclick="toggle('${d.id}')">ON/OFF</button>
      <button onclick="del('${d.id}')">Delete</button>
    </div>
  `).join("");
}

async function toggle(id){
  await fetch(API+"/toggle",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id })
  });
  load();
}

async function del(id){
  await fetch(API+"/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id })
  });
  load();
}
</script>

</body>
</html>
