<!DOCTYPE html>
<html>
<head>
  <title>XLOCK Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background:#0f172a;
      color:white;
      font-family:sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card {
      background:#1e293b;
      padding:30px;
      border-radius:16px;
      width:100%;
      max-width:400px;
    }

    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:none;
    }

    button {
      background:#38bdf8;
      color:black;
      font-weight:bold;
    }

    .result {
      margin-top:15px;
      font-size:12px;
      word-break:break-all;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Add License</h2>

  <input id="domain" placeholder="example.com">

  <button onclick="add()">Generate</button>

  <div class="result" id="result"></div>
</div>

<script>
async function add() {
  const domain = document.getElementById("domain").value;

  const res = await fetch("https://xlock.stakemail91.workers.dev/add", {
    method:"POST",
    body: JSON.stringify({ domain })
  });

  const data = await res.json();

  document.getElementById("result").innerText =
    "EXP: " + new Date(data.exp).toLocaleString() +
    "\\nLICENSE: " + JSON.stringify(data);
}
</script>

</body>
</html>
