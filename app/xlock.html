<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLOCK Generate</title>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:white;
}
.container{max-width:1200px;margin:auto;padding:20px;}
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}
input,select{
  width:100%;
  padding:12px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  background:#020617;
  color:white;
}
button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}
.badge{padding:4px 10px;border-radius:999px;font-size:12px;}
.active{background:#22c55e}
.expired{background:#ef4444}
.disabled{background:#6b7280}
.topbar{display:flex;justify-content:space-between;margin-bottom:15px;}
</style>
</head>

<body>

<div id="loginPage" style="display:flex;height:100vh;align-items:center;justify-content:center;">
  <div class="card" style="width:300px">
    <h2>Login</h2>
    <input id="email" placeholder="email">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="panel" style="display:none" class="container">

<div class="topbar">
<h2>XLOCK SaaS</h2>
<button onclick="logout()">Logout</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminBox" style="display:none">

<div class="card">
<h3>Add User</h3>
<input id="newEmail" placeholder="email">
<input id="newPass" placeholder="password">
<select id="newRole">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button onclick="addUser()">Tambah</button>
</div>

<div class="card">
<h3>Generate License</h3>
<input id="max" placeholder="max domain">
<button onclick="create()">Generate</button>
<div id="out"></div>
</div>

</div>

<!-- USER DOMAIN -->
<div id="userBox" style="display:none" class="card">
<h3>Tambah Domain</h3>
<input id="lic" placeholder="license id">
<input id="dom" placeholder="domain.com">
<button onclick="addDomain()">Add Domain</button>
<div id="dmsg"></div>
</div>

<!-- LIST -->
<div id="list" class="grid"></div>

</div>

<script>
const API="https://xlock.stakemail91.workers.dev";
let TOKEN=localStorage.getItem("token");
let ROLE="";

// INIT
if(TOKEN) start();

// LOGIN
async function login(){
  const res=await fetch(API+"/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email:email.value,password:pass.value })
  });
  const d=await res.json();

  if(d.status==="OK"){
    TOKEN=d.token;
    ROLE=d.role;
    localStorage.setItem("token",TOKEN);
    start();
  } else alert(d.message);
}

function start(){
  loginPage.style.display="none";
  panel.style.display="block";

  if(ROLE==="admin") adminBox.style.display="block";
  else userBox.style.display="block";

  load();
  setInterval(load,4000);
}

// LOAD
async function load(){
  const res=await fetch(API+"/list",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN }
  });
  const data=await res.json();

  list.innerHTML=data.map(x=>{
    let cls="active";
    if(x.status==="EXPIRED") cls="expired";
    if(x.status==="DISABLED") cls="disabled";

    return `
    <div class="card">
      <b>${x.email}</b><br>
      <span class="badge ${cls}">${x.status}</span><br><br>

      License:<br>${x.id}<br><br>

      Expire:<br>${new Date(x.expire).toLocaleDateString()}<br><br>

      Domain:<br>${x.domains.join("<br>")}<br><br>

      Sisa: ${x.remaining}

      ${ROLE==="admin" ? `
      <br><br>
      <button onclick="toggle('${x.id}')">Toggle</button>
      <button onclick="del('${x.id}')">Delete</button>
      `:""}
    </div>`;
  }).join("");
}

// ACTION
async function addUser(){
  await fetch(API+"/add-user",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({
      email:newEmail.value,
      password:newPass.value,
      role:newRole.value
    })
  });
}

async function create(){
  const r=await fetch(API+"/add",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({ maxDomain:max.value })
  });
  const d=await r.json();
  out.innerHTML=d.license;
}

async function addDomain(){
  const r=await fetch(API+"/add-domain",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({
      license:lic.value,
      domain:dom.value
    })
  });
  const d=await r.json();
  dmsg.innerHTML=d.message||d.error;
}

async function toggle(id){
  await fetch(API+"/toggle",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({id})
  });
}
async function del(id){
  await fetch(API+"/delete",{
    method:"POST",
    headers:{ "Content-Type":"application/json","Authorization":TOKEN },
    body: JSON.stringify({id})
  });
}

function logout(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
