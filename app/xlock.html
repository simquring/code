<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLOCK PANEL</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#020617;
  color:white;
  display:flex;
  justify-content:center;
}
.container{max-width:1000px;width:100%;padding:20px;}
.card{background:#0f172a;padding:20px;border-radius:12px;margin-bottom:20px;}
input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;}
button{padding:10px;border:none;border-radius:8px;cursor:pointer;margin:3px;}
.badge{padding:3px 8px;border-radius:999px;font-size:12px;}
.active{background:#22c55e;}
.expired{background:#ef4444;}
.disabled{background:#6b7280;}
</style>
</head>

<body>
<div class="container">

<div class="card" id="loginBox">
<h3>Login</h3>
<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">

<div class="card">
<h3>Generate License</h3>
<input id="max" placeholder="max domain">
<button onclick="create()">Generate</button>
<div id="out"></div>
</div>

<div class="card">
<h3>License</h3>
<div id="list"></div>
</div>

</div>

</div>

<script>
const API="https://xlock.stakemail91.workers.dev";

let SESSION = JSON.parse(localStorage.getItem("session")||"null");

if(SESSION){
  loginBox.style.display="none";
  panel.style.display="block";
  start();
}

// LOGIN
async function login(){
  const res = await fetch(API+"/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email:email.value, password:pass.value })
  });

  const d = await res.json();

  if(d.status==="OK"){
    SESSION = d;
    localStorage.setItem("session",JSON.stringify(d));
    loginBox.style.display="none";
    panel.style.display="block";
    start();
  } else alert(d.message);
}

// CREATE
async function create(){
  const res = await fetch(API+"/add",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      email: SESSION.email,
      maxDomain: max.value
    })
  });

  const d = await res.json();
  out.innerHTML = d.license;
}

// LOAD
async function load(){
  const res = await fetch(API+"/list",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(SESSION)
  });

  const data = await res.json();

  list.innerHTML = data.map(d=>{
    let cls="active";
    if(d.status==="EXPIRED") cls="expired";
    if(d.status==="DISABLED") cls="disabled";

    return `
    <div class="card">
      ${d.email}<br>
      <span class="badge ${cls}">${d.status}</span><br>
      Exp: ${new Date(d.expire).toLocaleDateString()}<br>
      Sisa: ${d.remaining}/${d.maxDomain}<br>

      ${SESSION.role==="admin" ? `
        <button onclick="toggle('${d.id}')">Toggle</button>
        <button onclick="del('${d.id}')">Delete</button>
      ` : ``}
    </div>
    `;
  }).join("");
}

// REALTIME
function start(){
  load();
  setInterval(load,5000);
}

// ACTION
async function toggle(id){
  await fetch(API+"/toggle",{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify({id})});
}
async function del(id){
  await fetch(API+"/delete",{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify({id})});
}
</script>

</body>
</html>
