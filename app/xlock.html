<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background:#020617;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

.card {
  background:#0f172a;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

button {
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
  <h2>Create License</h2>
  <input id="user" placeholder="User"><br><br>
  <input id="max" placeholder="Max Domain"><br><br>
  <button onclick="create()">Generate</button>
  <div id="out"></div>
</div>

<div class="card">
  <h2>License List</h2>
  <button onclick="load()">Refresh</button>
  <div id="list"></div>
</div>

<script>
const API = "https://xlock.stakemail91.workers.dev";

async function create() {
  const res = await fetch(API + "/add", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      user: user.value,
      maxDomain: max.value
    })
  });

  const d = await res.json();
  out.innerHTML = `LICENSE:<br>${d.license}<br>EXPIRE:<br>${d.expire}`;
}

async function load() {
  const res = await fetch(API + "/list");
  const data = await res.json();

  list.innerHTML = data.map(d => `
    <div class="card">
      ${d.user}<br>
      Exp: ${d.expire}<br>
      Domain: ${d.domains.join(",")}<br>
      <button onclick="del('${d.id}')">Delete</button>
    </div>
  `).join("");
}

async function del(id) {
  await fetch(API + "/delete", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id })
  });
  load();
}
</script>

</body>
</html>
