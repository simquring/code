<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Script Generator PRO++</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#020617,#0f172a);
    color:#fff;
}

.container {
    max-width:1000px;
    margin:auto;
    padding:30px;
}

.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
}

h1 {
    text-align:center;
}

input, textarea {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
}

textarea {
    height:220px;
    resize:none;
}

button {
    padding:10px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:5px;
    font-weight:bold;
}

.gen { background:#22c55e; }
.copy { background:#3b82f6; }
.dec { background:#f59e0b; }
.clear { background:#ef4444; }

.row {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.toggle {
    display:flex;
    gap:10px;
    margin:10px 0;
}

.history {
    margin-top:20px;
    max-height:200px;
    overflow:auto;
    background:#00000040;
    padding:10px;
    border-radius:10px;
}

.item {
    padding:8px;
    border-bottom:1px solid #ffffff20;
    cursor:pointer;
}

.item:hover {
    background:#ffffff10;
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<h1>🚀 Generator PRO++</h1>

<input id="url" placeholder="Masukkan URL..." />

<div class="toggle">
<label><input type="checkbox" id="antiInspect" checked> Anti Inspect</label>
<label><input type="checkbox" id="antiClick" checked> Disable Right Click</label>
<label><input type="checkbox" id="antiDebug" checked> Anti Debugger</label>
</div>

<div class="row">
<button class="gen" onclick="generate()">Generate</button>
<button class="copy" onclick="copy()">Copy</button>
<button class="dec" onclick="decrypt()">Decrypt</button>
<button class="clear" onclick="clearHistory()">Clear History</button>
</div>

<textarea id="output" placeholder="Hasil script..."></textarea>

<div class="history" id="history"></div>

</div>
</div>

<script>

// ===== HISTORY =====
function saveHistory(url, encoded){
    let data = JSON.parse(localStorage.getItem("hist") || "[]");
    data.unshift({url, encoded});
    data = data.slice(0,10);
    localStorage.setItem("hist", JSON.stringify(data));
    renderHistory();
}

function renderHistory(){
    let data = JSON.parse(localStorage.getItem("hist") || "[]");
    let html = "";
    data.forEach(d=>{
        html += `<div class="item" onclick="reuse('${d.url}')">${d.url}</div>`;
    });
    document.getElementById("history").innerHTML = html;
}

function reuse(url){
    document.getElementById("url").value = url;
}

function clearHistory(){
    localStorage.removeItem("hist");
    renderHistory();
}

// ===== GENERATE =====
function generate(){
    let url = document.getElementById("url").value.trim();
    if(!url) return alert("Masukkan URL!");

    let encoded = btoa(url);

    let antiInspect = document.getElementById("antiInspect").checked;
    let antiClick = document.getElementById("antiClick").checked;
    let antiDebug = document.getElementById("antiDebug").checked;

    let script = `<script>
(() => {
    const encodedURL = "${encoded}";

    const go = () => {
        window.location.href = atob(encodedURL);
    };

    ${antiInspect ? `
    const blockKeys = (e) => {
        const k = String(e.key || "").toLowerCase();
        if (
            (e.ctrlKey && k === 'u') ||
            (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(k)) ||
            k === 'f12'
        ) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            go();
            return false;
        }
    };

    window.addEventListener('keydown', blockKeys, true);
    document.addEventListener('keydown', blockKeys, true);
    ` : ``}

    ${antiClick ? `
    window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        go();
    }, true);
    ` : ``}

    ${antiDebug ? `
    setInterval(() => {
        const t = Date.now();
        debugger;
        if (Date.now() - t > 100) {
            go();
        }
    }, 500);
    ` : ``}

})();
<\/script>`;

    document.getElementById("output").value = script;

    saveHistory(url, encoded);
}

// ===== COPY =====
function copy(){
    let t = document.getElementById("output");
    t.select();
    document.execCommand("copy");
    alert("Copied!");
}

// ===== DECRYPT =====
function decrypt(){
    let input = prompt("Masukkan Base64:");
    try {
        alert(atob(input));
    } catch {
        alert("Invalid!");
    }
}

// INIT
renderHistory();

</script>
</body>
</html>
